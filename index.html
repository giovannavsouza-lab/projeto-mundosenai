<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabbin 17 - Mitos</title>
   
    <link rel="stylesheet" href="/Css/style2.css">
</head>
<body>
   
     <div id="tela-capa" class="capa-container" >  <!-- 1 tela : abre pro menu-->
        <div class="capa-livro">
            <h1>Cabbin 17</h1>
            <p>Mitos e lendas verdadeiramente impresionantes.</p>
            <button class="btn-abriir" onclick="abrirMenu()">Abrir Menu</button>
        </div>
    </div>

<div id="tela-menu" class="menu-container" style="display: none;">  <!-- 2 tela : abre pro livro -->
    <div class="capa-menu">
        <h1>Cabbin 17</h1>
        <p>Escolha seu deus</p>
        <button class="btn-abrir" onclick="abrirLivro()">Abrir Livro</button>
    </div>
</div>


    <div id="tela-principal" class="container" style="display: none;">  <!-- 3 tela : é o livro -->
       
        <div class="topo-acoes">
            <button class="btn-voltar" onclick="voltarMenu()">Voltar</button>
            <button class="btn-voltar" onclick="voltarInicio()">X</button>
           
            <div class="seletor-casas">
                <span>Sua benção:</span>
                <button class="btn-skin skin-apollo" title="Apollo" onclick="mudarDeus('skin-apollo')"></button>
                <button class="btn-skin skin-athena" title="Athena" onclick="mudarDeus('skin-athena')"></button>
                <button class="btn-skin skin-hermes" title="Hermes" onclick="mudarDeus('skin-hermes')"></button>
                <button class="btn-skin skin-afrodite" title="Afrodite" onclick="mudarDeus('skin-afrodite')"></button>
            </div>
        </div>


        <header>
            <h1 id="tituloPrincipal">Cabbin 17</h1>
            <p>Selecione um mito para iniciar a leitura</p>
        </header>


        <div class="main-content">
           
            <div class="menu-contos" id="menuContos"></div>


            <div class="leitor-conto" id="leitorConto">
                <h2 id="contoTitulo">Selecione uma história</h2>
                <p id="contoTexto">Clique em um dos mitos ao lado para ler a sua história e biografia.</p>
                <div id="contoNota" class="nota-alvo" style="display: none;"></div>
            </div>
           
        </div>


        <footer>
            <p>Cabbin 17 • Acampamento Meio-Sangue</p>
        </footer>


    </div>
   
    <script src="js/script.js"></script>
</body>  
</html>
